{% extends 'base.html' %}
{% block title %}Список товарів{% endblock %}
{% block content %}
<h2>Наші товари</h2>
<ul>
    {% for product in products %}
    <li>
        <a href="{{ url_for('products.product_detail', product_id=product.id) }}">{{ product.name }}</a> - ${{ product.price }}
    </li>
    {% endfor %}
</ul>
{% endblock %}
